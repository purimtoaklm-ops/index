<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Little Duck Pond 🦆</title>
<style>
  :root {
    --sky-top: #cdeffd;
    --sky-bottom: #eaf9ff;
    --water-top: #8fd8f2;
    --water-bottom: #4fb8e0;
    --duck-yellow: #ffd23f;
    --duck-yellow-dark: #f5b400;
    --duck-orange: #ff8c42;
    --pink: #ff6f9c;
    --text-dark: #3a3a4e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Baloo 2', 'Comic Sans MS', 'Segoe UI', sans-serif;
  }

  body {
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 55%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    touch-action: manipulation;
  }

  /* Floating clouds */
  .cloud {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    opacity: 0.85;
    filter: blur(0.5px);
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
  }
  .cloud1 { width: 70px; height: 28px; top: 8%; left: 10%; animation: drift 18s linear infinite; }
  .cloud1::before { width: 40px; height: 40px; top: -18px; left: 8px; }
  .cloud1::after { width: 30px; height: 30px; top: -12px; left: 34px; }
  .cloud2 { width: 55px; height: 22px; top: 15%; right: 12%; animation: drift 22s linear infinite reverse; }
  .cloud2::before { width: 32px; height: 32px; top: -14px; left: 6px; }
  .cloud2::after { width: 24px; height: 24px; top: -10px; left: 26px; }
  .cloud3 { width: 45px; height: 18px; top: 6%; left: 55%; animation: drift 25s linear infinite; }
  .cloud3::before { width: 26px; height: 26px; top: -12px; left: 4px; }
  .cloud3::after { width: 20px; height: 20px; top: -8px; left: 20px; }

  @keyframes drift {
    0% { transform: translateX(0); }
    50% { transform: translateX(15px); }
    100% { transform: translateX(0); }
  }

  /* Message banner */
  .message {
    margin-top: max(18px, env(safe-area-inset-top));
    padding: 10px 22px;
    font-size: clamp(16px, 5vw, 24px);
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--pink), #ff9ec4);
    border-radius: 30px;
    box-shadow: 0 6px 16px rgba(255, 111, 156, 0.4);
    opacity: 0;
    transform: translateY(-20px) scale(0.9);
    transition: opacity 0.6s ease, transform 0.6s ease;
    z-index: 10;
    text-align: center;
    letter-spacing: 0.3px;
    pointer-events: none;
  }
  .message.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .title {
    margin-top: 6px;
    font-size: clamp(14px, 4vw, 18px);
    color: var(--text-dark);
    opacity: 0.65;
    font-weight: 600;
    z-index: 5;
  }

  /* Pond area */
  .pond {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .duck-wrapper {
    position: relative;
    width: clamp(140px, 40vw, 220px);
    height: clamp(140px, 40vw, 220px);
    z-index: 3;
  }

  .duck-bob {
    width: 100%;
    height: 100%;
    animation: bob 2.6s ease-in-out infinite;
    transform-origin: 50% 80%;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
  }

  .duck-bob.sinking {
    animation: none;
    animation: sinkBounce 1.1s cubic-bezier(.36,.07,.19,.97);
  }

  @keyframes sinkBounce {
    0%   { transform: translateY(0) rotate(0deg) scale(1); }
    25%  { transform: translateY(45px) rotate(-8deg) scale(0.92, 1.08); }
    45%  { transform: translateY(50px) rotate(4deg) scale(0.95, 1.05); }
    65%  { transform: translateY(-28px) rotate(-6deg) scale(1.05, 0.92); }
    80%  { transform: translateY(8px) rotate(3deg) scale(0.98, 1.02); }
    100% { transform: translateY(0) rotate(-2deg) scale(1); }
  }

  .splash {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    z-index: 4;
    pointer-events: none;
  }
  .droplet {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #bdeeff;
    border: 2px solid #7fd4f2;
    border-radius: 50%;
    opacity: 0;
  }
  .splash.active .droplet {
    animation: pop 0.7s ease-out forwards;
  }
  .splash.active .droplet:nth-child(1) { animation-delay: 0.05s; }
  .splash.active .droplet:nth-child(2) { animation-delay: 0.1s; }
  .splash.active .droplet:nth-child(3) { animation-delay: 0.08s; }
  .splash.active .droplet:nth-child(4) { animation-delay: 0.12s; }
  .splash.active .droplet:nth-child(5) { animation-delay: 0.06s; }

  @keyframes pop {
    0%   { opacity: 1; transform: translate(0,0) scale(0.6); }
    100% { opacity: 0; transform: var(--end) scale(1); }
  }
  .droplet:nth-child(1) { --end: translate(-30px, -25px); }
  .droplet:nth-child(2) { --end: translate(25px, -30px); }
  .droplet:nth-child(3) { --end: translate(-15px, -38px); }
  .droplet:nth-child(4) { --end: translate(15px, -20px); }
  .droplet:nth-child(5) { --end: translate(0px, -42px); }

  .ripple {
    position: absolute;
    bottom: 14%;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 10px;
    border: 2px solid rgba(255,255,255,0.8);
    border-radius: 50%;
    opacity: 0;
    z-index: 2;
  }
  .ripple.active {
    animation: ripple-grow 0.9s ease-out forwards;
  }
  @keyframes ripple-grow {
    0%   { width: 20px; height: 8px; opacity: 0.9; }
    100% { width: 140px; height: 30px; opacity: 0; }
  }

  /* Water */
  .water {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 34%;
    background: linear-gradient(to bottom, var(--water-top), var(--water-bottom));
    z-index: 1;
  }
  .wave {
    position: absolute;
    top: -18px;
    left: 0;
    width: 200%;
    height: 20px;
  }
  .wave svg { width: 100%; height: 100%; display: block; }
  .wave.wave1 { animation: waveMove 6s linear infinite; opacity: 0.9; }
  .wave.wave2 { top: -10px; animation: waveMove 9s linear infinite reverse; opacity: 0.6; }

  @keyframes waveMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.7;
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 0.8; transform: scale(1.2); }
  }

  /* Button */
  .btn-area {
    padding: 18px 0 max(22px, env(safe-area-inset-bottom));
    z-index: 5;
  }

  .boop-btn {
    font-family: inherit;
    font-size: clamp(16px, 4.5vw, 20px);
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--duck-orange), var(--duck-yellow-dark));
    border: none;
    padding: 14px 34px;
    border-radius: 40px;
    box-shadow: 0 6px 0 #d98b1f, 0 10px 18px rgba(0,0,0,0.15);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .boop-btn:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #d98b1f, 0 4px 10px rgba(0,0,0,0.15);
  }

  footer {
    font-size: 11px;
    color: var(--text-dark);
    opacity: 0.4;
    padding-bottom: 6px;
  }
</style>
</head>
<body>

  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>

  <div id="message" class="message">i love u so much na</div>
  <div class="title">tap the button to boop the duck 🦆</div>

  <div class="pond">
    <div class="duck-wrapper">
      <div id="duckBob" class="duck-bob">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="100" cy="165" rx="58" ry="10" fill="#3a8fc4" opacity="0.25"/>
          <path d="M40 130 Q100 90 160 130 Q160 165 100 165 Q40 165 40 130 Z" fill="#ffffff"/>
          <path d="M45 128 Q100 98 155 128" stroke="#e8eef2" stroke-width="3" fill="none" stroke-linecap="round"/>
          <ellipse cx="100" cy="95" rx="55" ry="48" fill="#ffde59"/>
          <ellipse cx="70" cy="70" rx="30" ry="27" fill="#ffde59"/>
          <path d="M52 92 Q40 100 48 112 Q60 108 66 96 Z" fill="#ffde59"/>
          <path d="M52 92 Q40 100 48 112 Q60 108 66 96 Z" fill="#ffc93c" opacity="0.6"/>
          <path d="M15 66 Q45 55 58 78 Q40 82 15 66 Z" fill="#ff9436"/>
          <circle cx="58" cy="60" r="5.5" fill="#3a3a4e"/>
          <circle cx="60" cy="58" r="1.8" fill="#ffffff"/>
          <path d="M40 52 Q48 46 58 49" stroke="#3a3a4e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="88" cy="76" rx="10" ry="7" fill="#ffb6c1" opacity="0.7"/>
          <ellipse cx="130" cy="90" rx="26" ry="20" fill="#ffcf4d"/>
          <path d="M100 108 Q100 125 118 122 Q112 112 100 108 Z" fill="#ffcf4d"/>
        </svg>
      </div>
    </div>

    <div class="ripple" id="ripple"></div>
    <div class="splash" id="splash">
      <div class="droplet"></div>
      <div class="droplet"></div>
      <div class="droplet"></div>
      <div class="droplet"></div>
      <div class="droplet"></div>
    </div>

    <div class="water">
      <div class="sparkle" style="top:20%; left:15%;"></div>
      <div class="sparkle" style="top:45%; left:70%; animation-delay:0.6s;"></div>
      <div class="sparkle" style="top:60%; left:35%; animation-delay:1.2s;"></div>
      <div class="sparkle" style="top:30%; left:85%; animation-delay:0.3s;"></div>
      <div class="wave wave1">
        <svg viewBox="0 0 200 20" preserveAspectRatio="none">
          <path d="M0 10 Q25 0 50 10 T100 10 T150 10 T200 10 V20 H0 Z" fill="#ffffff" opacity="0.5"/>
        </svg>
      </div>
      <div class="wave wave2">
        <svg viewBox="0 0 200 20" preserveAspectRatio="none">
          <path d="M0 10 Q25 20 50 10 T100 10 T150 10 T200 10 V20 H0 Z" fill="#ffffff" opacity="0.4"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="btn-area">
    <button class="boop-btn" id="boopBtn">Boop the duck 🦆</button>
  </div>

  <footer>made with 💛 for a little duck</footer>

  <script>
    const duck = document.getElementById('duckBob');
    const btn = document.getElementById('boopBtn');
    const message = document.getElementById('message');
    const splash = document.getElementById('splash');
    const ripple = document.getElementById('ripple');
    let messageShown = false;
    let animating = false;

    btn.addEventListener('click', () => {
      if (!messageShown) {
        message.classList.add('show');
        messageShown = true;
      }

      if (animating) return;
      animating = true;

      duck.classList.remove('sinking');
      void duck.offsetWidth; // restart animation
      duck.classList.add('sinking');

      splash.classList.remove('active');
      void splash.offsetWidth;
      splash.classList.add('active');

      ripple.classList.remove('active');
      void ripple.offsetWidth;
      ripple.classList.add('active');

      setTimeout(() => {
        animating = false;
      }, 1100);
    });
  </script>
</body>
</html>
